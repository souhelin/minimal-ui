name: Quality checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-syntax:
    name: Web JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check web/components.js && node --check web/theme.js
      - name: Check required Web entry files
        run: |
          test -f web/index.html
          test -f web/tokens.css
          test -f web/components.css
          test -f web/theme.js
          test -f web/components.js
