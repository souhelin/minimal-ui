name: Validate Minimal UI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check web/theme.js
          node --check web/icons.js
          node --check web/components.js
      - name: Check required web files
        run: |
          test -s web/index.html
          test -s web/components.css
          test -s web/tokens.css
          test -s web/icons.js
          test -s web/patterns.css
          grep -q 'id="demo-dialog"' web/index.html
          grep -q 'id="demo-sheet"' web/index.html
          grep -q 'id="demo-form"' web/index.html
          grep -q 'id="paginated-list"' web/index.html
